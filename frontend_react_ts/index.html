<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/forge_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge by Modula Project — A Thinking Companion</title>
    <meta
      name="description"
      content="Forge is a thinking companion for capturing unfinished thoughts, exploring them with Owl, and noticing what may be starting to take shape."
    />
    <meta name="theme-color" content="#09090b" />
    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Forge by Modula Project — A Thinking Companion"
    />
    <meta
      property="og:description"
      content="Capture first. Understand later. Owl observes. The thinker decides."
    />
    <meta property="og:image" content="/forge_logo.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('forge_theme') || 'dark';
          var isDark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (t === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#09090b] text-[#fafafa]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
